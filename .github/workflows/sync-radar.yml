name: Sync live Radar Scout catalog
on:
  schedule:
    - cron: '27 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-catalog-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-radar-catalog.mjs
      - name: Update live index when changed
        run: |
          git add live-catalog.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync the live Radar Scout catalog'
          git push
